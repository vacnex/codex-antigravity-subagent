name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: plugins/antigravity-subagent/mcp/package-lock.json
      - name: Install dependencies
        working-directory: plugins/antigravity-subagent/mcp
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-diagnostics-node-${{ matrix.node-version }}.log"
      - name: Type-check
        working-directory: plugins/antigravity-subagent/mcp
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-diagnostics-node-${{ matrix.node-version }}.log"
      - name: Build bundled server
        working-directory: plugins/antigravity-subagent/mcp
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-diagnostics-node-${{ matrix.node-version }}.log"
      - name: Upload generated MCP bundle
        if: matrix.node-version == 20 && success()
        uses: actions/upload-artifact@v4
        with:
          name: agy-mcp-dist
          path: plugins/antigravity-subagent/mcp/dist/server.cjs
          if-no-files-found: error
      - name: Test MCP protocol
        working-directory: plugins/antigravity-subagent/mcp
        shell: bash
        run: |
          set -o pipefail
          npm run test:protocol 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-diagnostics-node-${{ matrix.node-version }}.log"
      - name: Verify generated bundle is current
        shell: bash
        run: |
          set -o pipefail
          git diff --exit-code -- plugins/antigravity-subagent/mcp/dist/server.cjs 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-diagnostics-node-${{ matrix.node-version }}.log"
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-node-${{ matrix.node-version }}
          path: ci-diagnostics-node-${{ matrix.node-version }}.log
          if-no-files-found: ignore
